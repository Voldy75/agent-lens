name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  selftest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No dependencies to install — that is the point.
      - run: node test/selftest.js
      # The package must also work the way users get it.
      - run: npm pack
        if: matrix.node == 20 && matrix.os == 'ubuntu-latest'
